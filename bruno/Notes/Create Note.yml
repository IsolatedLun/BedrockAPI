info:
  name: Create Note
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{PORT}}/notes/create
  body:
    type: json
    data: |-
      {
        "title": "yo",
        "text": "<h3>3rd note<h3>"
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
