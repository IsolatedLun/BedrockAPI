info:
  name: Create Note
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:{{PORT}}/notes/create
  body:
    type: json
    data: |-
      {
        "title": "new note",
        "text": "![Picture](https://picsum.photos/200/300)"
      }
  auth:
    type: bearer
    token: "{{JWT}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
